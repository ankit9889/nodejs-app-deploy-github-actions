name: Deply Node JS App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs--on: ubantu-latest

    setps:
      - name: Checkout Code
        usees: acions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: {{ secrets.SSH_KEY }}
          script: |
            cd /root/nodejs-app-deploy-github-actions
            git pull
            docker compose up -d --build